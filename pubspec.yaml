name: todo_and_lock
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.9.2

dependencies:
  uuid: ^4.4.2
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter:
    sdk: flutter
  flutter_overlay_window:
    path: packages/flutter_overlay_window
  intl: ^0.20.2
  flutter_slidable: ^4.0.3
  google_mobile_ads: ^7.0.0



dev_dependencies:
  hive_generator: ^2.0.0
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/Todo_tmp.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/


  fonts:
    - family: Paperlogy
      fonts:
        - asset: assets/fonts/Paperlogy-4Regular.ttf
          weight: 400
        - asset: assets/fonts/Paperlogy-5Medium.ttf
          weight: 500
    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf
